# Arm B probe on SFT fold b: a throwaway checkpoint used only to sample the
# opposite fold. 30 steps holds epochs over 106 traces equal to the baseline's
# 60 steps over 212, so the probe is not simply trained twice as hard.
max_steps = 30
output_dir = "outputs/probe_b_sft"

[wandb]
project = "predict-mbpp"
group = "cross-fit-probes"
name = "arm-b-probe-b"

[model]
name = "Qwen/Qwen3-4B-Base"
impl = "auto"
seq_len = 1280

[tokenizer]
chat_template = "configs/chat_template.jinja"
eos_token = "<|im_end|>"

[data]
type = "sft"
name = "data/folds/fold_b/sft/arm_b"
batch_size = 32
micro_batch_size = 1
seq_len = 1280
pack_function = "stack"
shuffle = true
seed = 42

[data.loss_mask]
system = false
user = false
assistant = true
tool = false

[optim]
type = "adamw"
lr = 2e-5
weight_decay = 0.01

[scheduler]
type = "linear"
warmup_steps = 1
decay_steps = 29
min_lr = 0.0

[ckpt]
interval = 30
keep_last = 1
weights_only = true

[deployment]
type = "single_node"
num_gpus = 1
gpus_per_node = 1
